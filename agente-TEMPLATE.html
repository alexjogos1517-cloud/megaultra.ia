<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>[NOME] - CineMorph AI</title>
<script src="modules-config.js"></script><script src="menu-fixo.js"></script>
<script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#080A0F] text-slate-100 flex h-screen overflow-hidden">
<aside class="w-64 bg-[#05070B] border-r border-slate-900 flex flex-col"><div class="p-5 border-b border-slate-900 flex items-center gap-3"><div class="w-10 h-10 bg-[#7C3AED] rounded-xl flex items-center justify-center font-black">CM</div><div><h1 class="text-[13px] font-extrabold text-white uppercase">CINEMORPH AI</h1></div></div><div class="p-3 border-b border-slate-900/50"><a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 text-slate-400 text-[12px]"><i class="fa-solid fa-house w-4"></i> Início</a><div id="userInfo" class="mt-2 px-3 py-2 text-[11px] text-slate-500 bg-black/50 rounded-lg border border-slate-900/50"></div></div><nav id="dynamicMenu" class="flex-1 overflow-y-auto px-3 py-4"></nav><div id="fixedMenuSlot" class="p-3 border-t border-slate-900"></div></aside>
<main class="flex-1 overflow-y-auto p-8"><div class="max-w-5xl mx-auto space-y-6"><div class="flex items-center gap-4"><div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-xl"></i></div><div><h2 class="text-2xl font-black text-white">[NOME DO AGENTE]</h2><p class="text-[13px] text-slate-400">Descrição do agente</p></div></div><div class="bg-slate-900 border border-slate-800 rounded-2xl p-6"><input id="inputNicho" placeholder="Digite seu nicho..." class="w-full bg-black border border-slate-800 rounded-xl px-4 py-3 text-[13px] text-white"><button id="btnGerar" class="mt-3 w-full py-3 bg-violet-600 text-white rounded-xl font-bold">Gerar</button></div><div id="resultadoArea" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6"></div></div></main>
<script>
document.getElementById('btnGerar')?.addEventListener('click',()=>{
  const nicho=document.getElementById('inputNicho').value.trim(); if(!nicho){alert('Digite nicho');return;}
  const key=localStorage.getItem('cm_gemini_key'); if(!key){if(confirm('Configure Gemini?')) location.href='configuracoes.html'; return;}
  document.getElementById('resultadoArea').classList.remove('hidden');
  document.getElementById('resultadoArea').innerHTML=`<p class="text-white">Resultado para: <b>${nicho}</b></p>`;
});
</script>
</body>
</html>
