<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte - CineMorph AI</title>
<script src="modules-config.js"></script><script src="menu-fixo.js"></script>
<script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#080A0F] text-slate-100 flex h-screen overflow-hidden">
<aside class="w-64 bg-[#05070B] border-r border-slate-900 flex flex-col"><div class="p-5 border-b border-slate-900 flex items-center gap-3"><div class="w-10 h-10 bg-[#7C3AED] rounded-xl flex items-center justify-center font-black text-white">CM</div><div><h1 class="text-[13px] font-extrabold text-white uppercase">CINEMORPH AI</h1></div></div><div class="p-3 border-b border-slate-900/50"><a href="index.html" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-900 text-slate-400 text-[12px]"><i class="fa-solid fa-house w-4"></i> Início</a><div id="userInfo" class="mt-2 px-3 py-2 text-[11px] text-slate-500 bg-black/50 rounded-lg border border-slate-900/50"></div></div><nav id="dynamicMenu" class="flex-1 overflow-y-auto px-3 py-4"></nav><div id="fixedMenuSlot" class="p-3 border-t border-slate-900"></div></aside>
<main class="flex-1 overflow-y-auto p-8"><div class="max-w-3xl mx-auto space-y-6"><h2 class="text-2xl font-black text-white">Suporte</h2><div id="waBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-6"></div><div id="tgBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mt-4"></div></div></main>
<script>
async function loadSup(){ try{ const r=await fetch('suporte.json?t='+Date.now()); if(!r.ok) throw new Error(); return await r.json(); }catch(e){ return { whatsapp:'5511999999999', whatsappMessage:'Olá, preciso de ajuda', telegram:'', email:'suporte@cinemorph.ai' }; } }
(async()=>{ const sup=await loadSup(); const num=sup.whatsapp.replace(/\D/g,''); const msg=encodeURIComponent(sup.whatsappMessage||'Olá'); document.getElementById('waBox').innerHTML=`<a href="https://wa.me/${num}?text=${msg}" target="_blank" class="flex items-center justify-center gap-2 bg-[#25D366] text-white py-3 rounded-xl font-bold">WhatsApp: ${sup.whatsapp}</a>`; document.getElementById('tgBox').innerHTML=sup.email? `Email: ${sup.email}`:'Telegram: '+sup.telegram; })();
</script>
</body>
</html>
